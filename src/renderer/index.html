<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Keynest</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="titlebar-drag"></div>

    <div id="root">
      <!-- ───────────── 解锁 / 初始化 ───────────── -->
      <main id="lock-view" class="lock-view">
        <div class="lock-inner">
          <div class="mark">
            <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
              <defs>
                <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#93a7ff" />
                  <stop offset="1" stop-color="#5a74e0" />
                </linearGradient>
              </defs>
              <rect x="1" y="1" width="38" height="38" rx="12" fill="url(#markGrad)" />
              <circle cx="20" cy="15.6" r="4.4" fill="#0b0d10" />
              <path
                d="M18.15 17.8h3.7l1.05 8.6a1.7 1.7 0 0 1-1.7 1.9h-2.4a1.7 1.7 0 0 1-1.7-1.9z"
                fill="#0b0d10"
              />
            </svg>
          </div>

          <h1 class="app-name">Keynest</h1>
          <p class="tagline" id="lock-tagline">输入主密码解锁</p>

          <form id="unlock-form" class="lock-form" autocomplete="off">
            <input
              id="master-password"
              class="input input-lg"
              type="password"
              placeholder="主密码"
              autocomplete="current-password"
              spellcheck="false"
            />
            <button type="submit" class="btn btn-primary btn-block" id="unlock-submit">解锁</button>
          </form>

          <button id="hello-btn" class="btn btn-quiet hidden">使用 Windows Hello 解锁</button>

          <form id="setup-form" class="lock-form hidden" autocomplete="off">
            <input
              id="setup-password"
              class="input input-lg"
              type="password"
              placeholder="设置主密码（至少 6 位）"
              autocomplete="new-password"
              spellcheck="false"
            />
            <input
              id="setup-confirm"
              class="input input-lg"
              type="password"
              placeholder="再次输入主密码"
              autocomplete="new-password"
              spellcheck="false"
            />
            <div class="strength" id="strength" aria-hidden="true"><i></i><i></i><i></i></div>
            <button type="submit" class="btn btn-primary btn-block">创建密码库</button>
            <p class="notice">
              主密码只用于派生加密密钥，不会被保存或上传。一旦遗忘，密码库无法恢复。
            </p>
          </form>

          <p id="lock-msg" class="lock-msg" role="status"></p>
        </div>
      </main>

      <!-- ───────────── 主界面 ───────────── -->
      <div id="app-view" class="app-view hidden">
        <aside class="sidebar">
          <header class="sidebar-head">
            <span class="wordmark">Keynest</span>
            <span class="head-actions">
              <button class="icon-btn" id="settings-btn" title="设置" aria-label="设置">
                <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                  <path d="M10 2.7 16.32 6.35v7.3L10 17.3 3.68 13.65v-7.3z" />
                  <circle cx="10" cy="10" r="2.5" />
                </svg>
              </button>
              <button class="icon-btn" id="lock-btn" title="锁定 (Ctrl+L)" aria-label="锁定">
                <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                  <rect x="4.4" y="8.6" width="11.2" height="8" rx="2.2" />
                  <path d="M7 8.6V6.4a3 3 0 0 1 6 0v2.2" />
                </svg>
              </button>
            </span>
          </header>

          <button class="new-folder-btn" id="add-folder-btn">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path d="M8 3.2v9.6M3.2 8h9.6" />
            </svg>
            新建目录
          </button>

          <nav class="tree" id="tree" aria-label="密码目录"></nav>
        </aside>

        <section class="list-pane">
          <header class="list-head">
            <div class="list-head-text">
              <h2 id="folder-title">全部密码</h2>
              <span id="folder-count" class="count"></span>
            </div>
            <button class="icon-btn accent" id="new-entry-btn" title="新建密码 (Ctrl+N)" aria-label="新建密码">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                <path d="M8 3.2v9.6M3.2 8h9.6" />
              </svg>
            </button>
          </header>

          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <circle cx="7.2" cy="7.2" r="4.2" />
              <path d="M10.4 10.4l3 3" />
            </svg>
            <input id="search" class="search-input" type="text" placeholder="搜索" spellcheck="false" />
          </div>

          <ul class="entry-list" id="entry-list"></ul>
        </section>

        <section class="detail-pane">
          <div class="detail" id="detail"></div>
        </section>
      </div>
    </div>

    <!-- 右键菜单 -->
    <div id="context-menu" class="context-menu hidden" role="menu"></div>

    <!-- 通用弹层 -->
    <div id="modal-layer" class="modal-layer hidden">
      <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script src="app.js"></script>
  </body>
</html>
